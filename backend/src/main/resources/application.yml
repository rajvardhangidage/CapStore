server:
  port: 8080

spring:
  application:
    name: capstore-backend
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:capstore}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway (db/migration)
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Local development uses Mailpit at localhost:1025; configure SMTP_* for another server.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

app:
  security:
    rate-limit:
      enabled: false
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: 15
    refresh-minutes: 5
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  tax:
    gst-rate-percent: 5          # confirm the correct GST rate for caps with your CA
  shipping:
    flat-rate: 70
    free-above: 999
  order:
    payment-timeout-minutes: 30
  returns:
    window-days: ${RETURN_WINDOW_DAYS:30}
  inventory:
    low-stock-threshold: 10
  razorpay:
    dev-mode: ${RAZORPAY_DEV_MODE:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@capstore.com}
  courier-webhook-secret: ${COURIER_WEBHOOK_SECRET:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  store:
    name: ${STORE_NAME:CapStore}
  business:                       # printed on GST invoices
    name: ${BUSINESS_NAME:Your Caps Company}
    gstin: ${BUSINESS_GSTIN:27AAAAA0000A1Z5}
    address: ${BUSINESS_ADDRESS:Your workshop address, City}
    state: ${BUSINESS_STATE:Maharashtra}
    email: ${BUSINESS_EMAIL:sales@yourcompany.com}
    phone: ${BUSINESS_PHONE:+91 90000 00000}
