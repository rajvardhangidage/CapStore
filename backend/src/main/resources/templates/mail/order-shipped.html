<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body style="font-family:Arial,sans-serif;color:#1b2a49">
  <h2>Your order has shipped</h2>
  <p>Hi <span th:text="${customerName}">Customer</span>,</p>
  <p>Order <strong th:text="${orderNo}">ORDER</strong> is on its way.</p>
  <p>Courier name: <strong th:text="${courier}">Courier</strong><br>
     Tracking ID (AWB): <strong th:text="${awb}">AWB</strong></p>
  <p th:if="${trackingUrl != null and !#strings.isEmpty(trackingUrl)}">
    <a th:href="${trackingUrl}">Track your shipment</a>
  </p>
  <p th:if="${expectedDelivery != null}">Expected delivery: <span th:text="${expectedDelivery}">Date</span></p>
</body>
</html>
