# One-command setup:  cp .env.example .env  &&  docker compose up --build
# Store:  http://localhost        Admin:  http://localhost/admin        API docs:  http://localhost/swagger-ui.html (via :8080)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}
      MYSQL_DATABASE: ${DB_NAME:-capstore}
      MYSQL_USER: ${DB_USER:-capstore_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    image: capstore-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      args:
        VERSION: ${IMAGE_TAG:-local}
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-capstore}
      DB_USER: ${DB_USER:-capstore_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (32+ random characters)}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost},http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-5242880}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      STORE_NAME: ${STORE_NAME:-CapStore}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RAZORPAY_DEV_MODE: ${RAZORPAY_DEV_MODE:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      COURIER_WEBHOOK_SECRET: ${COURIER_WEBHOOK_SECRET:-}
      BUSINESS_NAME: ${BUSINESS_NAME:-Cap Store}
      BUSINESS_GSTIN: ${BUSINESS_GSTIN:-27AAAAA0000A1Z5}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-Your workshop address, City}
      BUSINESS_STATE: ${BUSINESS_STATE:-Maharashtra}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-sales@capstore.com}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-+91 90000 00000}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-${BUSINESS_EMAIL:-sales@capstore.com}}
      MAIL_FROM: ${MAIL_FROM:-no-reply@capstore.com}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql-data:
    name: capstore-dev-mysql-data
  uploads:
